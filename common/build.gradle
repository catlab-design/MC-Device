architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    compileOnly "su.plo.voice.api:client:$rootProject.plasmovoice_api_version"
    compileOnly "su.plo.voice.api:server:$rootProject.plasmovoice_api_version"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:$rootProject.simplevoicechat_api_version"

    implementation "org.xerial:sqlite-jdbc:3.42.0.0"
}
